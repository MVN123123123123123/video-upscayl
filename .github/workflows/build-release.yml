name: Build & Release Standalone Executables

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release and attach binaries"
        required: false
        type: boolean
        default: false

jobs:
  # =========================================================================
  # 1. LINUX APPIMAGE BUILD (Ubuntu 22.04 for wide glibc compatibility)
  # =========================================================================
  build-linux:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies & build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            glslang-tools \
            glslang-dev \
            spirv-tools \
            python3-tk \
            tk-dev \
            tcl-dev \
            libgomp1 \
            ffmpeg \
            libgl1 \
            curl \
            wget \
            file

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Build C++ Native Backend (Vulkan / Multi-Core SIMD)
        run: |
          rm -rf build/CMakeCache.txt build/CMakeFiles build/build.ninja
          bash scripts/build_backend.sh

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build Standalone Linux AppImage
        run: |
          bash scripts/build_appimage.sh

      - name: Verify AppImage File
        run: |
          ls -lh dist/Video-Upscayl-x86_64.AppImage
          file dist/Video-Upscayl-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Upscayl-Linux-x86_64-AppImage
          path: dist/Video-Upscayl-x86_64.AppImage
          if-no-files-found: error

  # =========================================================================
  # 2. WINDOWS STANDALONE EXE BUILD
  # =========================================================================
  build-windows:
    name: Build Windows Standalone Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "Downloading Vulkan SDK from LunarG..."
          $installer = "$env:TEMP\VulkanSDK-Installer.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.4.304.0/windows/VulkanSDK-1.4.304.0-Installer.exe" -OutFile $installer
          Write-Host "Installing Vulkan SDK silently..."
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          Remove-Item -Force $installer
          if (Test-Path "C:\VulkanSDK") {
              $sdkDir = (Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
              Write-Host "Vulkan SDK successfully installed at: $sdkDir"
              "VULKAN_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "$sdkDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
              Write-Host "Warning: C:\VulkanSDK not found, build script will check PATH."
          }

      - name: Download Prebuilt NCNN Windows VS2022 Libraries
        shell: pwsh
        run: |
          Write-Host "Downloading prebuilt NCNN Windows VS2022 release..."
          $zipUrl = "https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-windows-vs2022.zip"
          $zipFile = "third_party\ncnn_win.zip"
          $extractDir = "third_party\ncnn_extracted"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile
          Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force
          Copy-Item -Recurse -Force "$extractDir\ncnn-20260526-windows-vs2022\*" "third_party\ncnn\"
          Remove-Item -Force $zipFile
          Remove-Item -Recurse -Force $extractDir
          Write-Host "NCNN Windows libraries deployed successfully."

      - name: Build Native Windows DLL (videoupscaler.dll)
        shell: cmd
        run: |
          if exist build\CMakeCache.txt del /f /q build\CMakeCache.txt
          if exist build\CMakeFiles rmdir /s /q build\CMakeFiles
          call scripts\build_windows.bat

      - name: Download Portable FFmpeg for Windows
        shell: pwsh
        run: |
          Write-Host "Downloading portable FFmpeg..."
          $ffUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $ffZip = "ffmpeg_win.zip"
          $ffExtract = "ffmpeg_extracted"
          Invoke-WebRequest -Uri $ffUrl -OutFile $ffZip
          Expand-Archive -Path $ffZip -DestinationPath $ffExtract -Force
          New-Item -ItemType Directory -Force -Path "tools"
          Copy-Item "$ffExtract\*\bin\ffmpeg.exe" "tools\"
          Copy-Item "$ffExtract\*\bin\ffprobe.exe" "tools\"
          Remove-Item -Force $ffZip
          Remove-Item -Recurse -Force $ffExtract
          Write-Host "Bundled tools\ffmpeg.exe and tools\ffprobe.exe"

      - name: Install Python dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Package Standalone Windows Executable (.exe)
        shell: pwsh
        run: |
          python scripts/package_windows.py --mode onefile

      - name: Verify Windows Executable
        shell: pwsh
        run: |
          Get-ChildItem -Path dist\Video-Upscayl-Windows-x64.exe | Select-Object Name, Length, LastWriteTime

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Upscayl-Windows-x64-Exe
          path: dist/Video-Upscayl-Windows-x64.exe
          if-no-files-found: error

  # =========================================================================
  # 3. AUTOMATED GITHUB RELEASE (Triggered on Tags or Manual Request)
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release asset directory
        run: mkdir -p release_assets

      - name: Download Linux AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: Video-Upscayl-Linux-x86_64-AppImage
          path: release_assets/

      - name: Download Windows Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: Video-Upscayl-Windows-x64-Exe
          path: release_assets/

      - name: Compute SHA256 Checksums
        run: |
          cd release_assets
          sha256sum Video-Upscayl-x86_64.AppImage Video-Upscayl-Windows-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/Video-Upscayl-x86_64.AppImage
            release_assets/Video-Upscayl-Windows-x64.exe
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
