[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-upscaler"
version = "1.1.0"
description = "Universal Hardware-Accelerated Video Super-Resolution Upscaler with native C++ Vulkan/Multi-Core SIMD backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "click>=8.0.0",
    "rich>=12.0.0",
    "pillow>=9.0.0",
    "tqdm>=4.60.0",
    "opencv-python>=4.5.0",
]

[project.scripts]
video-upscaler = "video_upscaler.cli:entry_point"
video-upscaler-gui = "video_upscaler.gui:launch_gui"

[project.gui-scripts]
video-upscaler = "video_upscaler.cli:entry_point"
video-upscaler-gui = "video_upscaler.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_upscaler*"]
